name: ARA compiler CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build compiler
        run: cargo build --release
      - name: Compile example program
        run: cargo run --release -- build examples/hello.ara -o /tmp/ara-hello
      - name: Run example and verify output
        run: test "$(/tmp/ara-hello)" = "42"

      - name: Compile control-flow example
        run: cargo run --release -- build examples/control_flow.ara -o /tmp/ara-control-flow
      - name: Run control-flow example and verify output
        run: test "$(/tmp/ara-control-flow)" = "$(printf '10\n0\n1\n2\n300\n4')"
